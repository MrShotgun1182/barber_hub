{% extends 'core/base.html' %}

{% block title %}رزرو نوبت | انتخاب تاریخ و ساعت{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8" x-data="datetimeWizard()">
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-extrabold text-gray-800">رزرو آنلاین نوبت 📅</h1>
        <p class="text-gray-500 mt-2">مرحله دوم: روز و ساعت دلخواهت رو انتخاب کن</p>
    </div>

    <div class="bg-white shadow-xl rounded-2xl p-6 md:p-8 border border-gray-100">
        
        <div class="mb-8">
            <label class="block text-lg font-bold text-gray-700 mb-3">۱. انتخاب تاریخ نوبت</label>
            <input type="date" 
                   x-model="selectedDate" 
                   @change="fetchSlots"
                   class="w-full md:w-1/2 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none transition-all text-gray-700 font-medium shadow-sm">
        </div>

        <div class="mb-8 border-t pt-6">
            <label class="block text-lg font-bold text-gray-700 mb-4">۲. سانس‌های قابل رزرو</label>
            
            <div x-show="loading" class="py-12 text-center text-gray-400 font-medium">
                <svg class="animate-spin h-8 w-8 text-indigo-600 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                >գ></svg>
                در حال بارگذاری سانس‌های آزاد...
            </div>

            <div x-show="!loading && slots.length === 0" class="py-12 text-center bg-gray-50 rounded-xl border border-dashed border-gray-200 text-gray-500">
                <span x-text="selectedDate ? 'متأسفانه در این تاریخ هیچ سانسی برای این آرایشگر موجود نیست.' : 'لطفاً ابتدا یک تاریخ را انتخاب کنید.'"></span>
            </div>

            <div x-show="!loading && slots.length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                <template x-for="slot in slots" :key="slot.start_time">
                    <button @click="selectedSlot = slot"
                            :class="selectedSlot && selectedSlot.start_time === slot.start_time ? 'bg-indigo-600 text-white border-indigo-600 shadow-md ring-2 ring-indigo-300' : 'bg-white hover:bg-gray-50 text-gray-700 border-gray-200'"
                            class="border rounded-xl py-3 px-4 text-center font-bold text-sm transition-all duration-200 flex flex-col items-center justify-center gap-1">
                        <span x-text="slot.display_text"></span>
                    </button>
                </template>
            </div>
        </div>

        <div class="border-t pt-6 flex items-center justify-between gap-4">
            <a href="{% url 'booking:select-barber' %}" 
               class="px-6 py-3 border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold rounded-xl transition-all duration-200">
                ← مرحله قبل
            </a>
            
            <button @click="nextStep"
                    :disabled="!selectedSlot"
                    :class="!selectedSlot ? 'opacity-50 cursor-not-allowed bg-gray-400' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200 shadow-lg'"
                    class="px-8 py-3 text-white font-bold rounded-xl transition-all duration-200">
                مرحله بعد: بررسی نهایی ➔
            </button>
        </div>

    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
    function datetimeWizard() {
        return {
            barberId: null,
            serviceIds: [],
            selectedDate: '',
            slots: [],
            selectedSlot: null,
            loading: false,
            
            init() {
                // خواندن پارامترهای URL که از مرحله قبل ارسال شده‌اند
                const urlParams = new URLSearchParams(window.location.search);
                this.barberId = urlParams.get('barber');
                const servicesParam = urlParams.get('services');
                
                if (servicesParam) {
                    this.serviceIds = servicesParam.split(',').map(Number);
                }
                
                // تنظیم تاریخ امروز به صورت پیش‌فرض (YYYY-MM-DD) بر اساس وقت محلی مرورگر
                // (toISOString تاریخ UTC می‌دهد و در ساعات ابتدایی شب به وقت تهران روز قبل را برمی‌گرداند)
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                this.selectedDate = today;
                
                if (this.barberId && this.serviceIds.length > 0) {
                    this.fetchSlots();
                }
            },
            
            fetchSlots() {
                if (!this.selectedDate || !this.barberId) return;
                
                this.loading = true;
                this.selectedSlot = null;
                this.slots = [];
                
                const params = new URLSearchParams({
                    barber_id: this.barberId,
                    service_ids: JSON.stringify(this.serviceIds),
                    date: this.selectedDate,
                    format: 'json'
                });
                
                fetch(`{% url 'booking:select-datetime' %}?${params.toString()}`, {
                    headers: {
                        'x-requested-with': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    this.loading = false;
                    if (data.status === 'success') {
                        this.slots = data.slots;
                    } else {
                        alert(data.message || 'خطا در دریافت سانس‌ها');
                    }
                })
                .catch(error => {
                    this.loading = false;
                    console.error('Error fetching slots:', error);
                });
            },
            
            nextStep() {
                if (!this.selectedSlot) return;
                
                // انتقال به مرحله بعد همراه با تمام پارامترها (آرایشگر، خدمات، تاریخ و ساعت)
                const targetUrl = `{% url 'booking:review_booking' %}?barber=${this.barberId}&services=${this.serviceIds.join(',')}&date=${this.selectedDate}&start_time=${this.selectedSlot.start_time}&end_time=${this.selectedSlot.end_time}`;
                
                window.location.href = targetUrl;
            }
        }
    }
</script>
{% endblock %}
