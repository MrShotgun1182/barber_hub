{% extends 'core/base.html' %}
{% load static %}

{% block title %}رزرو نوبت | انتخاب تاریخ و ساعت{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-8" x-data="datetimeWizard()">
    <div class="w-full max-w-2xl bg-cream-100 shadow-2xl rounded-2xl overflow-hidden border border-cream-200 flex flex-col h-[80vh] max-h-[640px]">

        <!-- ==================== ۳۰ درصد بالا: هدر با عکس پس‌زمینه و مراحل ==================== -->
        <div class="relative flex-[0_0_30%]" style="flex: 0 0 30%;">
            <!-- عکس پس‌زمینه (آرایشگاه) -->
            <img src="{% static 'images/booking/step3.jpg' %}" 
                 alt="پس‌زمینه آرایشگاه" 
                 class="absolute inset-0 w-full h-full object-cover">
            
            <!-- کادر نیمه شفاف -->
            <div class="absolute inset-0 bg-sage-900/60 flex items-center justify-center">
                <!-- چهار دایره مراحل -->
                <div class="flex items-center gap-2 md:gap-4">
                    <!-- مرحله ۱ -->
                    <div class="flex flex-col items-center">
                        <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-cream-50/25 border-2 border-cream-200 flex items-center justify-center text-cream-50 font-bold text-xs md:text-sm">۱</div>
                        <span class="text-cream-100 text-[9px] md:text-[10px] mt-1 font-medium">آرایشگر</span>
                    </div>
                    <div class="w-4 md:w-8 h-0.5 bg-cream-200/30"></div>

                    <!-- مرحله ۲ -->
                    <div class="flex flex-col items-center">
                        <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-cream-50/25 border-2 border-cream-200 flex items-center justify-center text-cream-50 font-bold text-xs md:text-sm">۲</div>
                        <span class="text-cream-100 text-[9px] md:text-[10px] mt-1 font-medium">خدمات</span>
                    </div>
                    <div class="w-4 md:w-8 h-0.5 bg-cream-200/30"></div>

                    <!-- مرحله ۳ (فعال) -->
                    <div class="flex flex-col items-center">
                        <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-cream-300 border-2 border-cream-400 flex items-center justify-center text-sage-900 font-bold text-xs md:text-sm shadow-lg shadow-cream-300/40">۳</div>
                        <span class="text-cream-300 text-[9px] md:text-[10px] mt-1 font-medium">انتخاب تاریخ</span>
                        <span class="text-cream-300 text-[9px] md:text-[10px] mt-1 font-medium">و ساعت</span>
                    </div>
                    <div class="w-4 md:w-8 h-0.5 bg-cream-200/30"></div>

                    <!-- مرحله ۴ -->
                    <div class="flex flex-col items-center">
                        <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-cream-50/25 border-2 border-cream-200 flex items-center justify-center text-cream-50 font-bold text-xs md:text-sm">۴</div>
                        <span class="text-cream-100 text-[9px] md:text-[10px] mt-1 font-medium">پرداخت</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== ۷۰ درصد پایین: دو سطر ۵۰-۵۰ ==================== -->
<!-- ==================== ۷۰ درصد پایین: ساختار دو ستونه (تاریخ و زمان) ==================== -->
        <div class="flex flex-col md:flex-row flex-[0_0_70%] overflow-hidden bg-cream-50" style="flex: 0 0 70%;">

            <!-- ===== ستون سمت راست: انتخاب تاریخ (تقویم) ===== -->
<!-- ===== ستون سمت راست: انتخاب تاریخ (۷ روز آینده - بدون اسکرول و کاملاً فشرده) ===== -->
            <div class="w-full md:w-1/2 p-3 border-b md:border-b-0 md:border-l border-cream-200 flex flex-col justify-between"
                 x-data="dateCardsManager()">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-xs font-bold text-sage-800">۱. انتخاب تاریخ نوبت</h2>
                        <span class="text-[10px] text-sage-600 font-medium" x-text="currentMonthName"></span>
                    </div>

                    <!-- کانتینر کارت‌های ۷ روز آینده (بدون اسکرول، کاملاً فشرده و مرتب) -->
                    <div class="grid grid-cols-1 gap-1.5">
                        <template x-for="dateObj in availableDates" :key="dateObj.dateStr">
                            <button type="button"
                                    @click="selectDate(dateObj.dateStr)"
                                    :class="selectedDate === dateObj.dateStr ? 'bg-sage-500 text-cream-50 border-sage-500 shadow-sm ring-1 ring-sage-300' : 'bg-cream-100 hover:bg-cream-200/60 text-sage-900 border-cream-300'"
                                    class="w-full border rounded-lg px-2.5 py-1.5 transition-all duration-200 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <!-- باکس کوچک و جمع‌وجور عدد روز -->
                                    <div :class="selectedDate === dateObj.dateStr ? 'bg-cream-50/20 text-cream-50' : 'bg-cream-200 text-sage-800'"
                                         class="w-7 h-7 rounded-md flex items-center justify-center font-black text-xs transition-colors">
                                        <span x-text="dateObj.dayNum"></span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs font-bold" x-text="dateObj.dayName"></span>
                                        <span class="text-[10px] opacity-75 mr-1" x-text="dateObj.shortDateStr"></span>
                                    </div>
                                </div>
                                <!-- تگ وضعیت انتخاب -->
                                <div>
                                    <span class="text-[9px] px-1.5 py-0.5 rounded font-bold"
                                          :class="selectedDate === dateObj.dateStr ? 'bg-cream-50/20 text-cream-50' : 'text-sage-600 bg-cream-200/50'"
                                          x-text="selectedDate === dateObj.dateStr ? 'انتخاب‌شده' : 'انتخاب'"></span>
                                </div>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- دکمه مرحله قبل -->
                <div class="mt-3 pt-2 border-t border-cream-200 hidden md:block">
                    <a href="{% url 'booking:select-barber' %}`" 
                       class="inline-block px-3 py-1.5 border border-cream-300 hover:bg-cream-200/50 text-sage-800 font-bold rounded-lg transition-all duration-200 text-[10px]">
                        ← مرحله قبل
                    </a>
                </div>
            </div>

            <!-- ===== ستون سمت چپ: سانس‌های قابل رزرو و دکمه ادامه ===== -->
            <div class="w-full md:w-1/2 p-4 overflow-y-auto flex flex-col justify-between bg-cream-100">
                <div>
                    <h2 class="text-sm font-bold text-sage-800 mb-2.5">۲. سانس‌های قابل رزرو</h2>
                    
                    <!-- حالت لودینگ -->
                    <div x-show="loading" class="py-6 text-center text-dark-muted text-xs font-medium">
                        <svg class="animate-spin h-6 w-6 text-sage-600 mx-auto mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        در حال بارگذاری سانس‌های آزاد...
                    </div>

                    <!-- حالت خالی بودن سانس‌ها -->
                    <div x-show="!loading && slots.length === 0" class="py-4 text-center bg-cream-50 rounded-lg border border-dashed border-cream-200 text-dark-muted text-[11px]">
                        <span x-text="selectedDate ? 'متأسفانه در این تاریخ سانسی موجود نیست.' : 'لطفاً ابتدا یک تاریخ را انتخاب کنید.'"></span>
                    </div>

                    <!-- گرید اسلات‌های زمانی -->
                    <div x-show="!loading && slots.length > 0" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <template x-for="slot in slots" :key="slot.start_time">
                            <button @click="selectedSlot = slot"
                                    :class="selectedSlot && selected_start_time === slot.start_time || (selectedSlot && selectedSlot.start_time === slot.start_time) ? 'bg-sage-500 text-cream-50 border-sage-500 shadow-md ring-2 ring-sage-300' : 'bg-cream-50 hover:bg-cream-200/50 text-sage-900 border-cream-200'"
                                    class="border rounded-lg py-2 px-2 text-center font-bold text-xs transition-all duration-200 flex items-center justify-center">
                                <span x-text="slot.display_text"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- فوتر و دکمه‌های ناوبری (دکمه مرحله بعد در ستون چپ) -->
                <div class="mt-4 pt-3 border-t border-cream-200 flex items-center justify-between gap-3">
                    <!-- دکمه مرحله قبل برای حالت موبایل -->
                    <a href="{% url 'booking:select-barber' %}" 
                       class="px-4 py-2 border border-cream-300 hover:bg-cream-200/50 text-sage-800 font-bold rounded-lg transition-all duration-200 text-[11px] md:hidden">
                        ← مرحله قبل
                    </a>
                    
                    <button @click="nextStep"
                            :disabled="!selectedSlot"
                            :class="!selectedSlot ? 'opacity-50 cursor-not-allowed bg-cream-300 text-dark-muted' : 'bg-sage-500 hover:bg-sage-600 text-cream-50 shadow-sage-200 shadow-md'"
                            class="w-full md:w-auto ms-auto px-5 py-2 font-bold rounded-lg transition-all duration-200 text-[11px]">
                        مرحله بعد: بررسی نهایی ➔
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
    function datetimeWizard() {
        return {
            barberId: null,
            serviceIds: [],
            selectedDate: '',
            slots: [],
            selectedSlot: null,
            loading: false,
            
            init() {
                const urlParams = new URLSearchParams(window.location.search);
                this.barberId = urlParams.get('barber');
                const servicesParam = urlParams.get('services');
                
                if (servicesParam) {
                    this.serviceIds = servicesParam.split(',').map(Number);
                }
                
                const today = new Date().toISOString().split('T')[0];
                this.selectedDate = today;
                
                if (this.barberId && this.serviceIds.length > 0) {
                    this.fetchSlots();
                }
            },
            
            fetchSlots() {
                if (!this.selectedDate || !this.barberId) return;
                
                this.loading = true;
                this.selectedSlot = null;
                this.slots = [];
                
                const params = new URLSearchParams({
                    barber_id: this.barberId,
                    service_ids: JSON.stringify(this.serviceIds),
                    date: this.selectedDate,
                    format: 'json'
                });
                
                fetch(`{% url 'booking:select-datetime' %}?${params.toString()}`, {
                    headers: {
                        'x-requested-with': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    this.loading = false;
                    if (data.status === 'success') {
                        this.slots = data.slots;
                    } else {
                        alert(data.message || 'خطا در دریافت سانس‌ها');
                    }
                })
                .catch(error => {
                    this.loading = false;
                    console.error('Error fetching slots:', error);
                });
            },
            
            nextStep() {
                if (!this.selectedSlot) return;
                
                const targetUrl = `{% url 'booking:review_booking' %}?barber=${this.barberId}&services=${this.serviceIds.join(',')}&date=${this.selectedDate}&start_time=${this.selectedSlot.start_time}&end_time=${this.selectedSlot.end_time}`;
                
                window.location.href = targetUrl;
            }
        }
    }
function dateCardsManager() {
        return {
            get availableDates() {
                const daysList = [];
                const weekdays = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];
                const months = ['ژانویه', 'فوریه', 'مارس', 'آوریل', 'مه', 'ژوئن', 'ژوئیه', 'اوت', 'سپتامبر', 'اکتبر', 'نوامبر', 'دسامبر'];
                
                // تولید دقیقاً ۷ روز آینده
                for (let i = 0; i < 7; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() + i);
                    
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const dateStr = `${year}-${month}-${day}`;
                    
                    const dayName = weekdays[d.getDay()];
                    const dayNum = d.getDate();
                    const shortDateStr = `${dayNum} ${months[d.getMonth()]}`;
                    
                    daysList.push({
                        dateStr: dateStr,
                        dayName: dayName,
                        dayNum: dayNum,
                        shortDateStr: shortDateStr
                    });
                }
                return daysList;
            },

            get currentMonthName() {
                const months = ['ژانویه', 'فوریه', 'مارس', 'آوریل', 'مه', 'ژوئن', 'ژوئیه', 'اوت', 'سپتامبر', 'اکتبر', 'نوامبر', 'دسامبر'];
                return months[new Date().getMonth()] + ' ' + new Date().getFullYear();
            },

            selectDate(dateStr) {
                this.selectedDate = dateStr;
                this.fetchSlots(); 
            }
        }
    }

</script>
{% endblock %}
