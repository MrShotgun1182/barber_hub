{% extends 'core/base.html' %}

{% block title %}رزرو نوبت | انتخاب آرایشگر و خدمت{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8" x-data="bookingWizard()">
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-extrabold text-gray-800">رزرو آنلاین نوبت 💈</h1>
        <p class="text-gray-500 mt-2">مرحله اول: آرایشگر و خدمت مورد نظرت رو انتخاب کن</p>
    </div>

    <div class="bg-white shadow-xl rounded-2xl p-6 md:p-8 border border-gray-100">
        
        <div class="mb-8">
            <label class="block text-lg font-bold text-gray-700 mb-4">۱. انتخاب آرایشگر حرفه‌ای</label>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <template x-for="barber in barbers" :key="barber.barber_id">
                    <div @click="selectBarber(barber)"
                         :class="selectedBarber && selectedBarber.barber_id === barber.barber_id ? 'border-indigo-600 bg-indigo-50/50 ring-2 ring-indigo-600' : 'border-gray-200 hover:border-gray-300 bg-white'"
                         class="cursor-pointer border rounded-xl p-5 transition-all duration-200 flex flex-col justify-between shadow-sm">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-bold text-gray-800 text-lg" x-text="barber.name"></h3>
                                <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium" x-text="barber.username"></span>
                            </div>
                            <p class="text-gray-500 text-sm line-clamp-2 mb-4" x-text="barber.bio || 'بدون توضیحات'"></p>
                        </div>
                        <div class="text-xs text-indigo-600 font-semibold flex items-center gap-1">
                            <span x-text="barber.services.length + ' خدمت فعال'"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div x-show="selectedBarber" x-transition class="mb-8 border-t pt-6">
            <label class="block text-lg font-bold text-gray-700 mb-4">۲. انتخاب خدمت(ها)</label>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="service in selectedBarber?.services || []" :key="service.barber_service_id">
                    <div @click="toggleService(service)"
                         :class="isServiceSelected(service) ? 'border-emerald-600 bg-emerald-50/55 ring-2 ring-emerald-600' : 'border-gray-200 hover:border-gray-300 bg-white'"
                         class="cursor-pointer border rounded-xl p-4 transition-all duration-200 flex justify-between items-center shadow-sm">
                        <div>
                            <h4 class="font-bold text-gray-800" x-text="service.name"></h4>
                            <p class="text-xs text-gray-500 mt-1" x-text="service.description"></p>
                            <div class="flex items-center gap-3 mt-3 text-xs text-gray-600 font-medium">
                                <span class="bg-gray-100 px-2 py-1 rounded-md" x-text="service.duration_minutes + ' دقیقه'"></span>
                                <span class="text-emerald-600 font-bold" x-text="numberWithCommas(service.price) + ' تومان'"></span>
                            </div>
                        </div>
                        <div class="flex items-center justify-center w-6 h-6 rounded-full border"
                             :class="isServiceSelected(service) ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-gray-300'">
                            <svg x-show="isServiceSelected(service)" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div class="border-t pt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-sm text-gray-600">
                <span>مجموع هزینه: </span>
                <span class="font-bold text-gray-900 text-lg" x-text="numberWithCommas(totalPrice) + ' تومان'"></span>
            </div>
            <button @click="nextStep"
                    :disabled="!selectedBarber || selectedServices.length === 0"
                    :class="(!selectedBarber || selectedServices.length === 0) ? 'opacity-50 cursor-not-allowed bg-gray-400' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200 shadow-lg'"
                    class="w-full sm:w-auto px-8 py-3 text-white font-bold rounded-xl transition-all duration-200">
                مرحله بعد: انتخاب تاریخ و ساعت ➔
            </button>
        </div>

    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
{{ barbers|json_script:"barbers-data" }}
<script>
    function bookingWizard() {
        return {
            barbers: JSON.parse(document.getElementById('barbers-data').textContent),
            selectedBarber: null,
            selectedServices: [],
            
            selectBarber(barber) {
                if (this.selectedBarber?.barber_id !== barber.barber_id) {
                    this.selectedBarber = barber;
                    this.selectedServices = []; // با تغییر آرایشگر، خدمات انتخابی ریست شود
                }
            },
            
            toggleService(service) {
                const index = this.selectedServices.findIndex(s => s.barber_service_id === service.barber_service_id);
                if (index > -1) {
                    this.selectedServices.splice(index, 1);
                } else {
                    this.selectedServices.push(service);
                }
            },
            
            isServiceSelected(service) {
                return this.selectedServices.some(s => s.barber_service_id === service.barber_service_id);
            },
            
            get totalPrice() {
                return this.selectedServices.reduce((sum, service) => sum + service.price, 0);
            },
            
            numberWithCommas(x) {
                return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            },
            
            nextStep() {
                if (!this.selectedBarber || this.selectedServices.length === 0) return;
                
                // جمع‌آوری شناسه‌ها برای ارسال به مرحله بعد
                const barberId = this.selectedBarber.barber_id;
                const serviceIds = this.selectedServices.map(s => s.barber_service_id).join(',');
                
                // ساخت URL با استفاده از نام مسیر جنگو (name pattern)
                const targetUrl = `{% url 'booking:select-datetime' %}?barber=${barberId}&services=${serviceIds}`;
                
                // هدایت کاربر به صفحه انتخاب تاریخ و ساعت
                window.location.href = targetUrl;
            }
        }
    }
</script>

{% endblock %}
