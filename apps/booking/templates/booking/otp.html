{% extends 'core/base.html' %}
{% load static %}

{% block title %}تایید کد یک‌بارمصرف | Barber Hub{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        
        <!-- کارت اصلی -->
        <div class="bg-cream-100 border border-cream-200 rounded-3xl p-6 sm:p-8 shadow-xl shadow-sage-900/5 transition-all duration-300">
            
            <!-- هدر و آیکون -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-sage-50 border border-sage-200 text-sage-600 mb-4 shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 id="pageTitle" class="text-2xl font-bold text-sage-800 tracking-tight mb-2">ورود به Barber Hub</h1>
                <p id="pageSubTitle" class="text-sm text-dark-muted leading-relaxed">
                    لطفاً شماره موبایل خود را وارد کنید تا کد تأیید برای شما ارسال شود.
                </p>
            </div>

            <!-- باکس نمایش پیغام‌های دینامیک (خطا / موفقیت) -->
            <div id="alertContainer" class="hidden mb-6 p-3.5 rounded-xl text-sm font-medium flex items-center gap-2 border transition-all duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span id="alertMessage"></span>
            </div>

            {% csrf_token %}

            <!-- ===================== بخش اول: دریافت شماره موبایل ===================== -->
            <form id="phoneForm" class="space-y-6">
                <div>
                    <label for="phoneNumberInput" class="block text-sm font-medium text-sage-800 mb-2">شماره موبایل</label>
                    <input type="tel" id="phoneNumberInput" maxlength="11" placeholder="09123456789" dir="ltr"
                           class="w-full px-4 py-3.5 text-center text-lg font-semibold text-dark-main bg-cream-50 border border-cream-300 rounded-2xl focus:border-sage-500 focus:ring-2 focus:ring-sage-500/20 outline-none transition-all duration-150" />
                </div>

                <button type="submit" id="sendPhoneBtn"
                        class="w-full py-3.5 px-4 bg-sage-500 hover:bg-sage-600 text-white font-semibold rounded-2xl shadow-md shadow-sage-500/20 hover:shadow-lg hover:shadow-sage-600/30 active:scale-[0.99] transition-all duration-200 cursor-pointer flex items-center justify-center gap-2">
                    <span id="sendPhoneBtnText">ارسال کد تأیید</span>
                </button>
            </form>

            <!-- ===================== بخش دوم: ورود کد OTP (در ابتدا مخفی) ===================== -->
            <div id="otpSection" class="hidden">
                <form id="otpForm" class="space-y-6">
                    <!-- ۶ باکس ورودی عدد -->
                    <div class="flex items-center justify-between gap-2 sm:gap-3 dir-ltr" id="otpInputsContainer">
                        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold text-dark-main bg-cream-50 border border-cream-300 rounded-xl focus:border-sage-500 focus:ring-2 focus:ring-sage-500/20 outline-none transition-all duration-150" />
                        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold text-dark-main bg-cream-50 border border-cream-300 rounded-xl focus:border-sage-500 focus:ring-2 focus:ring-sage-500/20 outline-none transition-all duration-150" />
                        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold text-dark-main bg-cream-50 border border-cream-300 rounded-xl focus:border-sage-500 focus:ring-2 focus:ring-sage-500/20 outline-none transition-all duration-150" />
                        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold text-dark-main bg-cream-50 border border-cream-300 rounded-xl focus:border-sage-500 focus:ring-2 focus:ring-sage-500/20 outline-none transition-all duration-150" />
                        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold text-dark-main bg-cream-50 border border-cream-300 rounded-xl focus:border-sage-500 focus:ring-2 focus:ring-sage-500/20 outline-none transition-all duration-150" />
                        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-digit w-11 h-13 sm:w-12 sm:h-14 text-center text-xl font-bold text-dark-main bg-cream-50 border border-cream-300 rounded-xl focus:border-sage-500 focus:ring-2 focus:ring-sage-500/20 outline-none transition-all duration-150" />
                    </div>

                    <!-- دکمه تایید -->
                    <button type="submit" id="submitBtn"
                            class="w-full py-3.5 px-4 bg-sage-500 hover:bg-sage-600 text-white font-semibold rounded-2xl shadow-md shadow-sage-500/20 hover:shadow-lg hover:shadow-sage-600/30 active:scale-[0.99] transition-all duration-200 cursor-pointer flex items-center justify-center gap-2">
                        <span id="submitBtnText">تأیید و ورود به Barber Hub</span>
                    </button>
                </form>

                <!-- بخش تایمر و ویرایش شماره -->
                <div class="mt-8 pt-6 border-t border-cream-200 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm">
                    <button type="button" id="editPhoneBtn" class="text-dark-muted hover:text-sage-800 transition-colors flex items-center gap-1.5 font-medium cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        <span>ویرایش شماره (<span id="currentPhoneDisplay"></span>)</span>
                    </button>

                    <div class="flex items-center gap-2 text-dark-muted">
                        <span id="timerContainer" class="flex items-center gap-1 bg-cream-200 px-3 py-1 rounded-lg text-sage-800 font-mono font-medium">
                            <span id="countdownTimer">02:00</span>
                        </span>

                        <button type="button" id="resendBtn" disabled 
                                class="text-sage-500 font-semibold hover:text-sage-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all cursor-pointer">
                            ارسال مجدد کد
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const phoneForm = document.getElementById('phoneForm');
    const phoneNumberInput = document.getElementById('phoneNumberInput');
    const sendPhoneBtn = document.getElementById('sendPhoneBtn');
    const sendPhoneBtnText = document.getElementById('sendPhoneBtnText');
    
    const otpSection = document.getElementById('otpSection');
    const otpForm = document.getElementById('otpForm');
    const inputs = document.querySelectorAll('.otp-digit');
    const currentPhoneDisplay = document.getElementById('currentPhoneDisplay');
    const editPhoneBtn = document.getElementById('editPhoneBtn');
    
    const resendBtn = document.getElementById('resendBtn');
    const countdownElement = document.getElementById('countdownTimer');
    const timerContainer = document.getElementById('timerContainer');
    const alertContainer = document.getElementById('alertContainer');
    const alertMessage = document.getElementById('alertMessage');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const pageTitle = document.getElementById('pageTitle');
    const pageSubTitle = document.getElementById('pageSubTitle');

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    let timerInterval = null;
    let activePhoneNumber = sessionStorage.getItem('phone_number') || "";

    function showAlert(message, isError = true) {
        alertContainer.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-sage-50', 'text-sage-800', 'border-sage-200');
        alertContainer.classList.add(isError ? 'bg-red-50' : 'bg-sage-50', isError ? 'text-red-700' : 'text-sage-800', isError ? 'border-red-200' : 'border-sage-200');
        alertMessage.textContent = message;
    }

    function showOtpStep(phone) {
        activePhoneNumber = phone;
        sessionStorage.setItem('phone_number', phone);
        currentPhoneDisplay.textContent = phone;
        
        phoneForm.classList.add('hidden');
        otpSection.classList.remove('hidden');
        pageTitle.textContent = 'تایید شماره موبایل';
        pageSubTitle.innerHTML = `کد تأیید به شماره <span class="font-semibold dir-ltr inline-block text-sage-800 bg-cream-200 px-2 py-0.5 rounded-md">${phone}</span> ارسال شد.`;
        
        inputs[0].focus();
        startTimer(120);
    }

    function showPhoneStep() {
        otpSection.classList.add('hidden');
        phoneForm.classList.remove('hidden');
        pageTitle.textContent = 'ورود به Barber Hub';
        pageSubTitle.textContent = 'لطفاً شماره موبایل خود را وارد کنید تا کد تأیید برای شما ارسال شود.';
        phoneNumberInput.value = activePhoneNumber;
        phoneNumberInput.focus();
        clearInterval(timerInterval);
    }

    // ۱. ارسال شماره موبایل برای دریافت کد
    phoneForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = phoneNumberInput.value.trim();
        
        if (!phone || phone.length !== 11 || !phone.startsWith('09')) {
            showAlert('لطفاً یک شماره موبایل معتبر ۱۱ رقمی وارد کنید.');
            return;
        }

        sendPhoneBtn.disabled = true;
        sendPhoneBtnText.textContent = 'در حال ارسال...';

        try {
            const response = await fetch("{% url 'booking:send_otp' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ phone_number: phone })
            });
            const data = await response.json();

            if (response.ok && data.status === 'success') {
                showAlert('کد تایید ارسال شد.', false);
                showOtpStep(phone);
            } else {
                showAlert(data.message || 'خطا در ارسال کد.');
            }
        } catch (err) {
            showAlert('خطا در ارتباط با سرور.');
        } finally {
            sendPhoneBtn.disabled = false;
            sendPhoneBtnText.textContent = 'ارسال کد تأیید';
        }
    });

    // ۲. مدیریت حرکت بین اینپوت‌های ۶ رقمی
    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !input.value && index > 0) inputs[index - 1].focus();
        });
    });

    // ۳. ارسال و تایید کد OTP
    otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        let otpCode = Array.from(inputs).map(i => i.value).join('');

        if (otpCode.length !== 6) {
            showAlert('لطفاً کد ۶ رقمی را به طور کامل وارد کنید.');
            return;
        }

        submitBtn.disabled = true;
        submitBtnText.textContent = 'در حال بررسی...';

        try {
            const response = await fetch("{% url 'booking:verify_otp' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ phone_number: activePhoneNumber, otp_code: otpCode })
            });

            const data = await response.json();

            if (response.ok && data.is_authenticated) {
                showAlert(data.message || 'ورود با موفقیت انجام شد.', false);
                setTimeout(() => {
                    window.location.href = "{% url 'booking:select-barber' %}";
                }, 1000);
            } else {
                showAlert(data.message || 'کد وارد شده اشتباه یا منقضی شده است.');
                submitBtn.disabled = false;
                submitBtnText.textContent = 'تأیید و ورود به Barber Hub';
            }
        } catch (error) {
            showAlert('خطا در ارتباط با سرور.');
            submitBtn.disabled = false;
            submitBtnText.textContent = 'تأیید و ورود به Barber Hub';
        }
    });

    // ۴. دکمه ویرایش شماره
    editPhoneBtn.addEventListener('click', showPhoneStep);

    // ۵. مدیریت تایمر
    function startTimer(durationSeconds = 120) {
        clearInterval(timerInterval);
        let timeLeft = durationSeconds;
        resendBtn.disabled = true;
        timerContainer.classList.remove('hidden');

        timerInterval = setInterval(() => {
            timeLeft--;
            const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const seconds = String(timeLeft % 60).padStart(2, '0');
            countdownElement.textContent = `${minutes}:${seconds}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                resendBtn.removeAttribute('disabled');
                timerContainer.classList.add('hidden');
            }
        }, 1000);
    }

    // اگر شماره از قبل در sessionStorage بود، مستقیم برو استپ OTP
    if (activePhoneNumber) {
        showOtpStep(activePhoneNumber);
    }
});
</script>
{% endblock %}
