services:
  # 1. دیتابیس PostgreSQL
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=barber_db
      - POSTGRES_USER=barber_user
      - POSTGRES_PASSWORD=barber_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber_user -d barber_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. 브روکر Redis برای Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. وب‌سرور اصلی Django & Frontend
  web:
    build: .
    volumes:
      - .:/app
      - /app/frontend/node_modules
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - DEBUG=1
      - DB_NAME=barber_db
      - DB_USER=barber_user
      - DB_PASSWORD=barber_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /app/frontend && npm install && npm run build && npm run dev &
             cd /app && python manage.py migrate &&
             python manage.py shell -c \"from django.contrib.auth import get_user_model; from admin_panel.models import AdminPanelModel; User = get_user_model(); user, created = User.objects.get_or_create(username='admin', defaults={'email': 'admin@example.com', 'role': 'MANAGER', 'is_staff': True, 'is_superuser': True}); created and user.set_password('admin1234'); created and user.save(); AdminPanelModel.objects.get_or_create(user=user)\" &&
             python manage.py runserver 0.0.0.0:8000"

  # 4. پردازشگر تاسک‌های غیرهمزمان Celery Worker
  celery_worker:
    build: .
    volumes:
      - .:/app
      - /app/frontend/node_modules
    environment:
      - DEBUG=1
      - DB_NAME=barber_db
      - DB_USER=barber_user
      - DB_PASSWORD=barber_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core worker --loglevel=info

volumes:
  postgres_data: