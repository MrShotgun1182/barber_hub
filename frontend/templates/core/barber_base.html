{% extends 'core/base.html' %}

{% block content %}
<div class="flex min-h-screen">
    <!-- سیدبار پنل آرایشگر -->
    <aside class="w-64 bg-neutral-800 text-white flex flex-col p-4 shadow-lg">
        <div class="text-lg font-bold pb-4 border-b border-neutral-700 mb-4 text-center">
            پنل اختصاصی آرایشگر
        </div>
        <nav class="flex-grow space-y-2">
            <a href="{% url 'barbers:barbers_dashboard' %}" class="block py-2 px-4 rounded hover:bg-neutral-700 transition">داشبورد</a>
            <a href="#" class="block py-2 px-4 rounded hover:bg-neutral-700 transition">جدول نوبت‌های من</a>
            <a href="{% url 'barbers:manage_working_hours' %}" class="block py-2 px-4 rounded hover:bg-neutral-700 transition">تنظیم ساعات کاری</a>
            <a href="{% url 'barbers:manage_services' %}" class="block py-2 px-4 rounded hover:bg-neutral-700 transition">مدیریت خدمات من</a>
        </nav>
    </aside>

    <!-- محتوای اصلی صفحات آرایشگر -->
    <section class="flex-1 p-6 bg-gray-50">
        {% block barber_content %}{% endblock %}
    </section>
</div>
{% endblock %}
