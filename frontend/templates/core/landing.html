{% extends 'core/base.html' %}
{% load static %}

{% block title %}صفحه اصلی | Barber Hub{% endblock %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center px-6 py-12">
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center w-full">
        
        <!-- بخش متنی و دکمه دریافت نوبت -->
        <div class="flex flex-col items-start gap-6 text-right">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-900 leading-tight">
                تجربه‌ای سریع و آنلاین برای <span class="text-sage-600">رزرو نوبت پیرایش</span>
            </h1>
            <p class="text-lg text-slate-600 leading-relaxed max-w-xl">
                با باربر هاب، بدون معطلی نوبت خود را آنلاین تنظیم کرده و بهترین خدمات پیرایش را دریافت کنید.
            </p>
            <div class="pt-2">
                <a href="#" class="inline-flex items-center justify-center px-8 py-4 bg-sage-600 hover:bg-sage-700 text-white font-semibold text-lg rounded-2xl shadow-md transition-all">
                    دریافت نوبت
                </a>
            </div>
        </div>

        <!-- جایگاه قرارگیری تصویر SVG -->
        <div class="w-full flex justify-center items-center">
            <div class="w-full max-w-lg aspect-square bg-cream-100 rounded-3xl border-2 border-dashed border-sage-200 flex items-center justify-center p-8">
                <!-- SVG پیش‌فرض -->
                <svg class="w-full h-full text-sage-500 opacity-80" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M60 40 L140 160 M140 40 L60 160" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
                    <circle cx="50" cy="35" r="18" stroke="currentColor" stroke-width="10"/>
                    <circle cx="150" cy="35" r="18" stroke="currentColor" stroke-width="10"/>
                </svg>
            </div>
        </div>

    </div>
</section>
{% endblock %}
